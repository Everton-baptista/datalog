processors:
  tail_sampling:
    decision_wait: 5s
    num_traces: 20000
    expected_new_traces_per_sec: 500
    decision_cache:
      sampled_cache_size: 20000
      non_sampled_cache_size: 20000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: sample-other
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
service:
  pipelines:
    traces:
      processors: [memory_limiter, transform/default_privacy, tail_sampling, batch]

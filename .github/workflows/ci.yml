name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install "ruff==0.17.6"
      - run: ruff check .
      - run: ruff format --check .
      - run: npx --yes @biomejs/biome@2.6.5 lint

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q datalog examples benchmarks collector
      - run: python -c "import datalog.app, datalog.server, datalog.routes, datalog.manage"
      - run: node --check datalog/web/*.js datalog/profiling.cjs reporters/jest.cjs reporters/vitest.mjs reporters/summary.mjs examples/*_acceptance.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t datalog:ci .
      - run: docker run --rm datalog:ci python -c "import datalog.app"
